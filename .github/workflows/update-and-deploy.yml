name: Collect AI trends and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Recheck already-current projects within this batch
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ai-radar-production
  cancel-in-progress: false
jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection and ranking boundaries
        run: python -B -m unittest discover -s tests -v
      - name: Discover candidate repositories with persistent pagination
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_REST_REQUEST_LIMIT: 24
        run: python -B scripts/discover.py --max-requests 24
      - name: Collect public GitHub data
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          RADAR_REST_REQUEST_LIMIT: 940
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            python -B scripts/collect.py --batch-size 600 --new-limit 40 --no-discover --refresh --force-refresh
          else
            python -B scripts/collect.py --batch-size 600 --new-limit 40 --no-discover --refresh
          fi
      - name: Validate published dataset
        run: python -B scripts/validate_data.py
      - name: Save collected data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data data/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update daily AI trends'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test historical replay in frontend
        run: node --test tests/history.test.mjs
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
