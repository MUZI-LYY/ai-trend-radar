name: Collect AI trends and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Recheck already-current projects within this batch
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ai-radar-production
  cancel-in-progress: false
jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore canonical data from verified packs
        run: python -B scripts/restore_data.py
      - name: Test collection and ranking boundaries
        run: python -B -m unittest discover -s tests -v
      - name: Discover candidate repositories with persistent pagination
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_REST_REQUEST_LIMIT: 24
        run: python -B scripts/discover.py --max-requests 24 --pause-while-pending 1000
      - name: Collect public GitHub data
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          RADAR_REST_REQUEST_LIMIT: 700
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            python -B scripts/collect.py --batch-size 600 --new-limit 300 --no-discover --refresh --force-refresh
          else
            python -B scripts/collect.py --batch-size 600 --new-limit 300 --no-discover --refresh
          fi
      - name: Collect independent GitHub board
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # At 5,000+ tracked repositories, 240 refresh slots per hour can cover
        # one full source day while 20 slots remain available for new projects.
        # The collector stops before the job's 40-minute limit and saves progress.
        run: python -B scripts/collect_github.py --limit 260 --new-limit 20 --max-seconds 600 --pages 2
      - name: Build independent GitHub board
        run: python -B scripts/build_github_data.py --archive
      - name: Validate published dataset
        run: |
          python -B scripts/validate_data.py
          python -B scripts/pack_latest.py --restore --source /tmp/radar-packed-latest.json
          python -B scripts/validate_data.py --directory public/data/github
      - name: Update cumulative daily chart
        run: python -B scripts/build_tenure_index.py
      - name: Save collected data
        if: github.event_name != 'push'
        run: |
          python -B scripts/pack_latest.py --source data/github-repositories.json --output data/github-shards
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data data/discovery.json data/latest-shards data/github-shards
          if ! git diff --cached --quiet; then
            git commit -m 'data: update daily AI trends'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                conflicts="$(git diff --name-only --diff-filter=U)"
                # A concurrent verified history backfill may replace the whole
                # compressed GitHub pack. Keep that newer pack intact while
                # publishing this run's independent AI collection.
                if [ -z "$conflicts" ] || printf '%s\n' "$conflicts" | grep -v '^data/github-shards/' ; then
                  echo 'Unresolved non-GitHub data conflict; refusing to discard collection data.' >&2
                  exit 1
                fi
                echo 'Remote GitHub pack advanced; defer its refresh from this run.'
                git restore --source=HEAD --staged --worktree -- data/github-shards
                if git diff --cached --quiet; then
                  git rebase --skip
                else
                  GIT_EDITOR=true git rebase --continue
                fi
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
              sleep 3
            done
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test historical replay in frontend
        run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Compact deployment snapshots
        run: python -B scripts/compact_dist.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
